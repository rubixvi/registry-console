name: registry-console

services:
  app:
    image: ${REGISTRY_CONSOLE_IMAGE:-rubixvi/registry-console:edge}
    pull_policy: always
    user: '1000:1000'
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      DATA_DIR: /app/data
      NEXT_TELEMETRY_DISABLED: '1'
      TRIVY_RUNNER_URL: http://scanner:3001
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - registry-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 160
    mem_limit: 512m
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  scanner:
    image: ${REGISTRY_CONSOLE_IMAGE:-rubixvi/registry-console:edge}
    pull_policy: always
    user: '1001:1001'
    init: true
    restart: unless-stopped
    entrypoint: ['node', 'scripts/scanner.mjs']
    environment:
      NODE_ENV: production
      SCANNER_DIR: /app/scanner
      TRIVY_PATH: /usr/local/bin/trivy
      TRIVY_RUNNER_TOKEN: ${TRIVY_RUNNER_TOKEN:?Set TRIVY_RUNNER_TOKEN}
      REGISTRY_ALLOWED_ORIGINS: ${REGISTRY_ALLOWED_ORIGINS:-}
      ALLOW_HTTP_REGISTRIES: ${ALLOW_HTTP_REGISTRIES:-false}
      TRIVY_TIMEOUT_SECONDS: ${TRIVY_TIMEOUT_SECONDS:-180}
    expose:
      - '3001'
    volumes:
      - scanner-data:/app/scanner
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 96
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  registry-data:
  scanner-data:
