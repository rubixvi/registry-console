name: Build and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"
  IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || 'docker.io' }}
  MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}
  GHCR_IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Restore Next.js cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm run check

      - name: Build application
        run: pnpm run build

      - name: Test HTTPS origin configuration
        run: pnpm run test:integration

      - name: Test HTTP loopback configuration
        run: pnpm run test:integration
        env:
          INTEGRATION_HTTP: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: registry-console:ci
          pull: true
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci
          cache-from: |
            type=gha,scope=image-amd64
            type=gha,scope=image-release
          cache-to: type=gha,scope=image-amd64,mode=max

      - name: Test container
        run: pnpm run test:container registry-console:ci

      - name: Scan test image with Trivy
        run: |
          docker run --rm --user 0:0 \
            --mount type=bind,source=/var/run/docker.sock,target=/var/run/docker.sock,readonly \
            aquasec/trivy:0.76.1 image \
            --image-src docker \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --timeout 10m \
            --exit-code 1 \
            registry-console:ci

  publish:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image names
        id: image
        shell: bash
        run: |
          image_registry="${IMAGE_REGISTRY,,}"
          github_registry="${MIRROR_REGISTRY,,}"
          dockerhub_name="${IMAGE_NAME,,}"
          ghcr_name="${GHCR_IMAGE_NAME,,}"
          printf 'image_registry=%s\n' "$image_registry" >> "$GITHUB_OUTPUT"
          printf 'github_registry=%s\n' "$github_registry" >> "$GITHUB_OUTPUT"
          printf 'dockerhub=%s/%s\n' "$image_registry" "$dockerhub_name" >> "$GITHUB_OUTPUT"
          printf 'ghcr=%s/%s\n' "$github_registry" "$ghcr_name" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Authenticate to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ steps.image.outputs.image_registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Authenticate to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ steps.image.outputs.github_registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ${{ steps.image.outputs.dockerhub }}
            ${{ steps.image.outputs.ghcr }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and publish
        id: publish
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=image-release
            type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-release,mode=max
          provenance: true
          sbom: true

      - name: Published images
        env:
          DOCKERHUB_IMAGE: ${{ steps.image.outputs.dockerhub }}
          GHCR_IMAGE: ${{ steps.image.outputs.ghcr }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          printf 'Published image `%s@%s`\n' "$DOCKERHUB_IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Published image `%s@%s`\n' "$GHCR_IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
